<!DOCTYPE html>

<html>
    
    <head>
        <meta charset="UTF-8">
        <title>ESP32 BLE</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="estilos.css">
    </head>

    <body>

        <div id="app" class="container py-4">

            <div class="card">

                <div class="card-header">

                    <h4 class="mb-0">
                        ESP32 Web Bluetooth
                    </h4>

                </div>

                <div class="card-body">

                    <!-- ESTADO -->
                    <div class="mb-4">

                        <h5>Conexión BLE</h5>

                        <button class="btn btn-primary mr-2" @click="conectar" :disabled="conectado">
                            Conectar
                        </button>

                        <button class="btn btn-secondary" @click="desconectar" :disabled="!conectado">
                            Desconectar
                        </button>

                        <div class="mt-3">

                            Estado:

                            <strong :class="conectado ? 'text-success' : 'text-danger'">
                                {{ estadoConexion }}
                            </strong>

                        </div>

                    </div>

                    <hr>

                    <!-- SENSOR -->
                    <div class="mb-4">

                        <h5>Sensor</h5>

                        <div class="display-4">
                            {{ valorSensor }}
                        </div>

                        <small class="text-muted">
                            Última lectura: {{ ultimaLectura || '-' }}
                        </small>

                    </div>

                    <hr>

                    <!-- LED -->
                    <div>

                        <h5>LED</h5>

                        <div class="custom-control custom-switch">

                            <input
                                type="checkbox"
                                class="custom-control-input"
                                id="switchLed"
                                :checked="estadoLed"
                                @change="controlarLed($event.target.checked)"
                                :disabled="!conectado"
                            >

                            <label class="custom-control-label" for="switchLed">
                                {{ estadoLed ? 'Encendido' : 'Apagado' }}
                            </label>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>
        <script src="ble.js"></script>
        <script src="app.js"></script>
       
    </body>

</html>
